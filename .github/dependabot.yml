version: 2
updates:
  - package-ecosystem: github-actions
    schedule:
      interval: monthly
    cooldown:
      default-days: 10
    assignees:
      - Scille/ops-code-owners
    directory: /
    open-pull-requests-limit: 5
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
    groups:
      pre-commit:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 10
    open-pull-requests-limit: 15
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
    groups:
      dev-prettier:
        dependency-type: development
        patterns:
          - prettier*
