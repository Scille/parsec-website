name: Ci

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        timeout-minutes: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
        timeout-minutes: 2

      - name: Install dependencies
        run: npm install --ignore-scripts
        timeout-minutes: 2

      - name: Check prettier
        run: npm run prettier:check
        timeout-minutes: 2

      - name: Check knip
        run: npm run knip
        timeout-minutes: 2

  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        timeout-minutes: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
        timeout-minutes: 2

      - name: Install dependencies
        run: npm install --ignore-scripts
        timeout-minutes: 2

      - name: Run tests
        run: npm run build && npm run test
        timeout-minutes: 15

      - name: Run astro-check
        run: npm run astro-check
        timeout-minutes: 2

      - name: Archive test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin v7.0.2
        with:
          name: playwright-artifacts
          path: test-results/
