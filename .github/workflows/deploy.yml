name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        timeout-minutes: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
        timeout-minutes: 2

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 2

      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: /parsec-website/
          PAGES_SITE_URL: https://scille.github.io
        timeout-minutes: 5

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # pin v6.0.0
        timeout-minutes: 2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pin v5.0.0
        with:
          path: ./dist
        timeout-minutes: 2

  deploy:
    name: Deploy
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # pin v5.0.0
        timeout-minutes: 5
