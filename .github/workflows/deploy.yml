name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pin v7.0.0
        timeout-minutes: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pin v6.4.0
        with:
          node-version-file: .tool-versions
          cache: npm
        timeout-minutes: 2

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 2

      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: /parsec-website/
          PAGES_SITE_URL: https://scille.github.io
        timeout-minutes: 5

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # pin v5.0.0
        timeout-minutes: 2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # pin v3.0.1
        with:
          path: ./dist
        timeout-minutes: 2

  deploy:
    name: Deploy
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # pin v4.0.5
        timeout-minutes: 5
